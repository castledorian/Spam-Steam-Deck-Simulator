# Mise à jour automatique de la base de données SPAM.
# Toutes les 4 heures : récupère cartes / Tox / talents (EN pour le moteur, FR pour l'affichage)
# et les notes de patch Steam, vérifie l'intégrité, lance les tests, puis commit.
# Le commit déclenche le redéploiement (Vercel, Netlify…). En cas d'échec, rien n'est publié.
name: Synchronisation des données

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-donnees
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Synchroniser
        run: npm run sync
      - name: Contrôles (tests + types)
        run: |
          npm test
          npm run typecheck
      - name: Publier si les données ont changé
        run: |
          git add src/data/seed.json public/
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git config user.name "spam-lab-bot"
          git config user.email "spam-lab-bot@users.noreply.github.com"
          git commit -F .sync-message
          git push
