# Vérification du site dans un vrai navigateur (téléphone + PC), à la demande ou après une publication réussie.
# Compile le site, ouvre chaque page, mesure les débordements, ouvre une fiche de carte, lance une analyse de
# partie et une simulation réelle. Le rapport (et des miniatures des pages) est écrit dans le journal de l'action.
name: Vérification du site

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: verification
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Construire
        run: npm run build
      - name: Navigateur
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Pages, analyse de partie et simulation
        env:
          MINIATURES: "tox-chance"
        run: node scripts/apercu.mjs /tmp/apercu
