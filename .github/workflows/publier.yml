# Publication automatique de SpamLab sur GitHub Pages.
# - à chaque push sur main ;
# - toutes les heures : vérifie le SpamDex officiel (https://spamgame.com/data/). S'il y a une
#   nouvelle version, met à jour public/data (cartes en français + historique des patchs),
#   l'enregistre dans le dépôt, puis reconstruit et republie le site ;
# - à la demande (onglet Actions → « Publier le site » → Run workflow).
# Si les nouvelles données échouent aux contrôles, rien n'est publié : la version en ligne reste.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchroniser avec le SpamDex officiel
        id: sync
        run: node scripts/sync-data.mjs

      - name: Contrôler les données
        run: node --test "tests/*.test.mjs"

      - name: Enregistrer les nouvelles données dans le dépôt
        if: steps.sync.outputs.changed == 'true'
        run: |
          git add public/data/dataset.json public/data/layout.json public/data/patches.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "spamlab-bot"
          git config user.email "spamlab-bot@users.noreply.github.com"
          git commit -F .sync-message
          git push

      - name: Décider de la publication
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle version : le site en ligne est déjà à jour."
          fi

      - name: Installer les dépendances
        if: steps.decide.outputs.deploy == 'true'
        run: npm install --no-audit --no-fund

      - name: Construire le site
        if: steps.decide.outputs.deploy == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.decide.outputs.deploy == 'true'
        with:
          path: out

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
